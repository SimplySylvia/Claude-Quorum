r="middle">HALTED</text><text x="635.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">post-mortem and two redesigns</text><text x="635.0" y="489.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">then /quorum:spec-and-eval --redesign</text><path d="M290,502 V527" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="298.0" y="519.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#cf222e" text-anchor="start">no</text><rect x="115.0" y="530.0" width="350.0" height="50.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="290.0" y="551.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">builder: fix</text><text x="290.0" y="568.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">every instance of each Pattern Category</text><path d="M112.0,555 H48 V39 H112.0" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="38.0" y="297.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle" transform="rotate(-90 38.0 297.0)">next round</text><path d="M760,555 H468.0" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="760.0" y="547.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anch