<svg xmlns="http://www.w3.org/2000/svg" width="980" height="512" viewBox="0 0 980 512" role="img" aria-label="/quorum:run: spec, plan, build, simplify, the early blind test for MEDIUM and HIGH tasks, review loop, blind test, PR draft, in order. It stops to ask at the spec (one proposal of slug, tier, research, and docs, and the models the first time in a repo; --yes accepts all but a HIGH tier; a follow-up round only if your answers open new questions) and the plan (mockup sign-off for UI, plan approval with the plan's open questions; --yes approves a clean plan except for HIGH), and for your review of MEDIUM and HIGH tasks after the PR draft. It stops if the review loop or the blind test halts. The early blind test's blockers go to the review loop before round 1, and the later blind test's go back to it. LOW tasks skip both blind tests. It never pushes or opens the PR. --fast takes a LOW task through without spec reviewers or a plan stage, with one reviewer; --worktree builds the task in its own git worktree; --bug reproduces the bug first and proves it fixed; --deep-research runs lensed researchers in parallel and checks every claim; --map starts the next ready task of a cleared map."><defs><marker id="arrow-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a7e"/></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><text x="24.0" y="26.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">/quorum:run</text><text x="140.3" y="26.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">follows each stage's own steps in order, and goes on by itself between them</text><rect x="20.0" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="69.1" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Spec</text><line x1="69.1" y1="118.0" x2="69.1" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="69.1" cy="144.0" r="9" fill="#9a6700"/><rect x="65.1" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="70.5" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="69.1" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">one proposal: slug,</text><text x="69.1" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">tier, research,</text><text x="69.1" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">docs; models once</text><text x="69.1" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">per repo. --yes:</text><text x="69.1" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">all but HIGH</text><line x1="69.1" y1="230.0" x2="69.1" y2="247.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="69.1" cy="256.0" r="9" fill="#9a6700"/><rect x="65.1" y="251.5" width="2.6" height="9" fill="#ffffff"/><rect x="70.5" y="251.5" width="2.6" height="9" fill="#ffffff"/><text x="69.1" y="280.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">a follow-up round</text><text x="69.1" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">only if your</text><text x="69.1" y="308.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">answers open new</text><text x="69.1" y="322.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">questions</text><rect x="140.2" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="189.4" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Plan</text><path d="M121.2,96.0 H137.2" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="189.4" y1="118.0" x2="189.4" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="189.4" cy="144.0" r="9" fill="#9a6700"/><rect x="185.4" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="190.8" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="189.4" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">mockup sign-off</text><text x="189.4" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">(UI)</text><line x1="189.4" y1="188.0" x2="189.4" y2="205.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="189.4" cy="214.0" r="9" fill="#9a6700"/><rect x="185.4" y="209.5" width="2.6" height="9" fill="#ffffff"/><rect x="190.8" y="209.5" width="2.6" height="9" fill="#ffffff"/><text x="189.4" y="238.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">plan approval, with</text><text x="189.4" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">its open</text><text x="189.4" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">questions. --yes</text><text x="189.4" y="280.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">approves a clean</text><text x="189.4" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">plan, except HIGH</text><rect x="260.5" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="309.6" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Build</text><path d="M241.5,96.0 H257.5" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><rect x="380.8" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="429.9" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Simplify</text><path d="M361.8,96.0 H377.8" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><rect x="501.0" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="550.1" y="94.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Early blind</text><text x="550.1" y="110.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#59636e" text-anchor="middle">MEDIUM/HIGH</text><path d="M482.0,96.0 H498.0" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><rect x="621.2" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="670.4" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Review loop</text><path d="M602.2,96.0 H618.2" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="670.4" y1="118.0" x2="670.4" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="670.4" cy="144.0" r="9" fill="#cf222e"/><rect x="666.9" y="140.5" width="7" height="7" fill="#ffffff"/><text x="670.4" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">HALTED after the</text><text x="670.4" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">round cap</text><rect x="741.5" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="790.6" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Blind test</text><path d="M722.5,96.0 H738.5" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="790.6" y1="118.0" x2="790.6" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="790.6" cy="144.0" r="9" fill="#cf222e"/><rect x="787.1" y="140.5" width="7" height="7" fill="#ffffff"/><text x="790.6" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">HALTED if fixes</text><text x="790.6" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">don't converge</text><rect x="861.8" y="74.0" width="98.2" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="910.9" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PR draft</text><path d="M842.8,96.0 H858.8" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="910.9" y1="118.0" x2="910.9" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="910.9" cy="144.0" r="9" fill="#9a6700"/><rect x="906.9" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="912.3" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="910.9" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">MEDIUM/HIGH: your</text><text x="910.9" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">review. Never</text><text x="910.9" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">pushes or opens</text><text x="910.9" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">the PR</text><path d="M550.1,72 V58 H660.4 V71" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="605.2" y="53.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">early blockers</text><path d="M790.6,72 V58 H680.4 V71" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="735.5" y="53.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">blockers</text><circle cx="32.0" cy="362.0" r="9" fill="#9a6700"/><rect x="28.0" y="357.5" width="2.6" height="9" fill="#ffffff"/><rect x="33.4" y="357.5" width="2.6" height="9" fill="#ffffff"/><text x="48.0" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">stops and asks you</text><circle cx="202.0" cy="362.0" r="9" fill="#cf222e"/><rect x="198.5" y="358.5" width="7" height="7" fill="#ffffff"/><text x="218.0" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">stops: you decide what next</text><text x="960.0" y="366.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end">LOW tasks skip both blind tests and end READY.</text><text x="24.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">--until &lt;stage&gt; stops after a stage; /quorum:run again continues from the task's status, so it mixes with the single-stage commands.</text><text x="24.0" y="412.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--fast</text><text x="140.9" y="412.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">LOW only: spec without reviewers, no plan stage, build, one reviewer, proof, PR draft.</text><text x="24.0" y="434.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--worktree</text><text x="140.9" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">builds in its own git worktree, .claude/worktrees/&lt;slug&gt;; this one stays free for another task.</text><text x="24.0" y="456.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--bug</text><text x="140.9" y="456.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">reproduces it first; done only when the proof shows it fixed and failing without the fix.</text><text x="24.0" y="478.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--deep-research</text><text x="140.9" y="478.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">lensed researchers in parallel, every claim checked against its source.</text><text x="24.0" y="500.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--map</text><text x="140.9" y="500.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">starts the next ready task of a cleared /quorum:map, from the map's decisions.</text></svg>
