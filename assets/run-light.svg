<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="/quorum:run: spec, plan, build, simplify, review loop, blind test, PR draft, in order. It stops to ask once at the spec (one proposal of slug, tier, research, and docs, and the models the first time in a repo; --yes accepts all but a HIGH tier) and the plan (mockup sign-off for UI, plan approval; --yes approves a clean plan except for HIGH), and for your review of MEDIUM and HIGH tasks after the PR draft. It stops if the review loop or the blind test halts. Blind-test blockers go back to the review loop. It never pushes or opens the PR. --fast takes a LOW task through without spec reviewers or a plan stage, with one reviewer; --worktree builds the task in its own git worktree; --bug reproduces the bug first and proves it fixed; --deep-research runs lensed researchers in parallel and checks every claim."><defs><marker id="arrow-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a7e"/></marker><marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs><text x="24.0" y="26.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start">/quorum:run</text><text x="140.3" y="26.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">follows each stage's own steps in order, and goes on by itself between them</text><rect x="20.0" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="77.7" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Spec</text><line x1="77.7" y1="118.0" x2="77.7" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="77.7" cy="144.0" r="9" fill="#9a6700"/><rect x="73.7" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="79.1" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="77.7" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">one proposal: slug,</text><text x="77.7" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">tier, research, docs;</text><text x="77.7" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">models once per repo.</text><text x="77.7" y="210.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">--yes: all but HIGH</text><rect x="157.4" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="215.1" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Plan</text><path d="M138.4,96.0 H154.4" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="215.1" y1="118.0" x2="215.1" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="215.1" cy="144.0" r="9" fill="#9a6700"/><rect x="211.1" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="216.5" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="215.1" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">mockup sign-off (UI)</text><line x1="215.1" y1="174.0" x2="215.1" y2="191.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="215.1" cy="200.0" r="9" fill="#9a6700"/><rect x="211.1" y="195.5" width="2.6" height="9" fill="#ffffff"/><rect x="216.5" y="195.5" width="2.6" height="9" fill="#ffffff"/><text x="215.1" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">plan approval. --yes</text><text x="215.1" y="238.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">approves a clean</text><text x="215.1" y="252.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">plan, except HIGH</text><rect x="294.9" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="352.6" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Build</text><path d="M275.9,96.0 H291.9" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><rect x="432.3" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="490.0" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Simplify</text><path d="M413.3,96.0 H429.3" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><rect x="569.7" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="627.4" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Review loop</text><path d="M550.7,96.0 H566.7" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="627.4" y1="118.0" x2="627.4" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="627.4" cy="144.0" r="9" fill="#cf222e"/><rect x="623.9" y="140.5" width="7" height="7" fill="#ffffff"/><text x="627.4" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">HALTED after the</text><text x="627.4" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">round cap</text><rect x="707.1" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="764.9" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Blind test</text><path d="M688.1,96.0 H704.1" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="764.9" y1="118.0" x2="764.9" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="764.9" cy="144.0" r="9" fill="#cf222e"/><rect x="761.4" y="140.5" width="7" height="7" fill="#ffffff"/><text x="764.9" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">HALTED if fixes don't</text><text x="764.9" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">converge</text><rect x="844.6" y="74.0" width="115.4" height="44.0" rx="8" fill="#ffffff" stroke="#d1d9e0"/><text x="902.3" y="101.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">PR draft</text><path d="M825.6,96.0 H841.6" fill="none" stroke="#0f8a7e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-go)"/><line x1="902.3" y1="118.0" x2="902.3" y2="135.0" stroke="#d1d9e0" stroke-dasharray="3 3"/><circle cx="902.3" cy="144.0" r="9" fill="#9a6700"/><rect x="898.3" y="139.5" width="2.6" height="9" fill="#ffffff"/><rect x="903.7" y="139.5" width="2.6" height="9" fill="#ffffff"/><text x="902.3" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">MEDIUM/HIGH: your</text><text x="902.3" y="182.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">review. Never pushes</text><text x="902.3" y="196.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1f2328" text-anchor="middle">or opens the PR</text><path d="M764.9,72 V58 H627.4 V71" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-back)"/><text x="696.1" y="53.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#cf222e" text-anchor="middle">blockers</text><circle cx="32.0" cy="292.0" r="9" fill="#9a6700"/><rect x="28.0" y="287.5" width="2.6" height="9" fill="#ffffff"/><rect x="33.4" y="287.5" width="2.6" height="9" fill="#ffffff"/><text x="48.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">stops and asks you</text><circle cx="202.0" cy="292.0" r="9" fill="#cf222e"/><rect x="198.5" y="288.5" width="7" height="7" fill="#ffffff"/><text x="218.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">stops: you decide what next</text><text x="960.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end">LOW tasks skip the blind test and end READY.</text><text x="24.0" y="320.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">--until &lt;stage&gt; stops after a stage; /quorum:run again continues from the task's status, so it mixes with the single-stage commands.</text><text x="24.0" y="342.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--fast</text><text x="140.9" y="342.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">LOW only: spec without reviewers, no plan stage, build, one reviewer, proof, PR draft.</text><text x="24.0" y="364.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--worktree</text><text x="140.9" y="364.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">builds in its own git worktree, .claude/worktrees/&lt;slug&gt;; this one stays free for another task.</text><text x="24.0" y="386.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--bug</text><text x="140.9" y="386.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">reproduces it first; done only when the proof shows it fixed and failing without the fix.</text><text x="24.0" y="408.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="start">--deep-research</text><text x="140.9" y="408.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">lensed researchers in parallel, every claim checked against its source.</text></svg>
